[project]
name = "sql-neatfmt"
version = "0.1.10"
description = "A compact SQL formatter with dialect-aware parsing."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Lucius Chen", email = "chenyh572@gmail.com" },
]
maintainers = [
  { name = "Lucius Chen", email = "chenyh572@gmail.com" },
]
keywords = ["sql", "formatter", "mysql", "postgresql", "oracle", "sqlglot"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
  "Topic :: Software Development :: Code Generators",
  "Topic :: Text Editors",
]
dependencies = [
  "sqlglot>=28.0.0",
]

[project.urls]
Homepage = "https://github.com/LuciusChen/sql-neatfmt"
Repository = "https://github.com/LuciusChen/sql-neatfmt"
Issues = "https://github.com/LuciusChen/sql-neatfmt/issues"
Changelog = "https://github.com/LuciusChen/sql-neatfmt/blob/main/CHANGELOG.md"

[project.scripts]
sql-neatfmt = "sql_neatfmt.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/review-cases",
  "/scripts",
  "/README.md",
  "/AGENTS.md",
  "/LICENSE",
  "/CHANGELOG.md",
  "/pyproject.toml",
  "/uv.lock",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sql_neatfmt"]
